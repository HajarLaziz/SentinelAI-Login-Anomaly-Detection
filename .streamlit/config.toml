[theme]
base = "light"
primaryColor = "#93643f"
backgroundColor = "#f5efe5"
secondaryBackgroundColor = "#eee3d3"
textColor = "#33251e"
font = "sans serif"
baseFontSize = 17
[browser]
gatherUsageStats = false
[client]
toolbarMode = "minimal"
[server]
maxUploadSize = 10
fileWatcherType = "poll"
runOnSave = true
